[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-ai-company-v2"
version = "2.0.0a1"
description = "Revenue-first control plane for the Shtenco Synergy repository federation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
synergy-company = "company_v2.cli:main"

[tool.setuptools.packages.find]
include = ["company_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
