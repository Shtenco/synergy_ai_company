services:
  company:
    build: .
    env_file: .env
    command: python scripts/run_api.py
    volumes:
      - ./var:/app/var
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: python -m company_v2.worker
    volumes:
      - ./var:/app/var
    depends_on: [company]
    restart: unless-stopped

  telegram:
    build: .
    env_file: .env
    command: python -m company_v2.telegram.bot
    volumes:
      - ./var:/app/var
    depends_on: [company]
    network_mode: host
    restart: unless-stopped
